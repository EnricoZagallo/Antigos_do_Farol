name: Publicar site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Bloquear chaves secretas no site
        run: |
          if grep -RInE "sb_secret_|service_role|BEGIN (RSA |EC )?PRIVATE KEY" site; then
            echo "::error::Encontrei algo que parece uma chave secreta dentro da pasta site. Publicação cancelada."
            exit 1
          fi

      - name: Conferir se o config.js foi preenchido
        run: |
          if grep -E "SEU-PROJETO|COLE-AQUI" site/config.js; then
            echo "::error::Preencha o site/config.js (Supabase e Turnstile) antes de publicar."
            exit 1
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
